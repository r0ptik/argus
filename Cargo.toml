[workspace]
members = [
    "crates/argus-engine",
    "crates/argus-router",
    "crates/argus-rs",
    "crates/argus-scan",
    "crates/argus-winmem",
    "crates/evidence-core",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
